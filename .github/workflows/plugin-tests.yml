name: Plugin Tests

on:
  push:
    branches:
      - master
      - v8-author
    paths:
      - 'requirements.txt'
      - 'requirements.lock'
      - 'pytest.ini'
      - 'conftest.py'
      - 'webnovel-writer/scripts/**'
      - 'webnovel-writer/mcp/**'
      - 'webnovel-writer/dashboard/**'
      - '.github/workflows/plugin-tests.yml'
  pull_request:
    paths:
      - 'requirements.txt'
      - 'requirements.lock'
      - 'pytest.ini'
      - 'conftest.py'
      - 'webnovel-writer/scripts/**'
      - 'webnovel-writer/mcp/**'
      - 'webnovel-writer/dashboard/**'
      - '.github/workflows/plugin-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock

      - name: Run test suite
        run: python -X utf8 -m pytest

      - name: Security module coverage floor (P2-3)
        run: python -m coverage report --include="*security_utils.py" --fail-under=90

      - name: Run validation scripts
        run: |
          python webnovel-writer/scripts/sync_plugin_version.py --check
          python webnovel-writer/scripts/validate_release_notes.py
          python webnovel-writer/scripts/validate_plugin_package.py
          python webnovel-writer/scripts/validate_reference_wiring.py

      # 纯 v7 路径端到端冒烟（2026-09-12 接入）：此前 v8.1.0 发版链（pytest /
      # 行为评测 / 四校验）无一层跑在「纯 v7 书仓」上，甲-1 / U-8 / U-10 / U-11
      # 因此长期隐身。--allow-break 只放过已登记断点，新断点仍判失败——
      # 不要改成数量阈值，那会掩盖新问题。
      - name: Run v7 newbook smoke (纯 v7 路径端到端)
        run: python -X utf8 webnovel-writer/scripts/smoke_v7_newbook.py --allow-break "8 knowledge"

  # N-2：ubuntu 的 locale 是 UTF-8，结构性地看不到「父进程与子进程编码约定不一致」
  # 这一类缺陷——N-1 因此在 CI 里隐身了两轮（只在本机中文 Windows 上暴露）。
  # 这个 Windows job 专门盯这一类：它跑的就是 AGENTS.md 上写的原样命令，
  # 刻意不设 PYTHONUTF8，因为要复现的正是「用户照文档敲」的场景。
  tests-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock

      - name: Run test suite (documented command, no PYTHONUTF8)
        run: python -X utf8 -m pytest

      # 同上。这个 job 也跑一遍是刻意的：冒烟测的是路径解析 + 子进程编码这类
      # 平台敏感链路，而 ubuntu 的 locale 是 UTF-8，结构性地看不到这一类缺陷
      # （N-1 曾在 CI 里隐身两轮，见本文件 tests-windows 的说明）。
      - name: Run v7 newbook smoke (纯 v7 路径端到端)
        run: python -X utf8 webnovel-writer/scripts/smoke_v7_newbook.py --allow-break "8 knowledge"
