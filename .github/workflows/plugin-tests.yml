name: Plugin Tests

on:
  push:
    branches:
      - master
      - v8-author
    paths:
      - 'requirements.txt'
      - 'requirements.lock'
      - 'pytest.ini'
      - 'webnovel-writer/scripts/**'
      - 'webnovel-writer/mcp/**'
      - 'webnovel-writer/dashboard/**'
      - '.github/workflows/plugin-tests.yml'
  pull_request:
    paths:
      - 'requirements.txt'
      - 'requirements.lock'
      - 'pytest.ini'
      - 'webnovel-writer/scripts/**'
      - 'webnovel-writer/mcp/**'
      - 'webnovel-writer/dashboard/**'
      - '.github/workflows/plugin-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock

      - name: Run test suite
        run: python -X utf8 -m pytest

      - name: Security module coverage floor (P2-3)
        run: python -m coverage report --include="*security_utils.py" --fail-under=90

      - name: Run validation scripts
        run: |
          python webnovel-writer/scripts/sync_plugin_version.py --check
          python webnovel-writer/scripts/validate_release_notes.py
          python webnovel-writer/scripts/validate_plugin_package.py
          python webnovel-writer/scripts/validate_reference_wiring.py
